<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tem um monstro na garagem</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1026">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>

<style>
  :root {
    --noite: #1d1026;
    --nevoa: #35234a;
    --osso: #f0e8d4;
    --osso-suave: #c9bfd6;
    --abobora: #ff7a1a;
    --abobora-escura: #c24f00;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: radial-gradient(ellipse at 50% 38%, var(--nevoa) 0%, var(--noite) 70%);
    color: var(--osso);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      20px
      calc(env(safe-area-inset-bottom, 0px) + 20px);
    overflow: hidden;
  }

  h1 {
    font-family: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 9vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    margin: 0;
    text-align: center;
    text-wrap: balance;
  }

  model-viewer {
    flex: 1;
    width: 100%;
    min-height: 0;
    --poster-color: transparent;
    background: transparent;
    outline: none;
  }

  .progresso {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(70%, 320px);
    text-align: center;
    font-size: 1rem;
    color: var(--osso-suave);
    transition: opacity 0.4s ease;
  }
  .progresso .trilho {
    height: 8px;
    margin-top: 12px;
    border-radius: 999px;
    background: rgba(240, 232, 212, 0.18);
    overflow: hidden;
  }
  .progresso .barra {
    height: 100%;
    width: 0%;
    background: var(--abobora);
    border-radius: inherit;
    transition: width 0.2s ease;
  }
  model-viewer[loaded] .progresso { opacity: 0; pointer-events: none; }

  .botao-ar {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 18px 24px;
    border: 0;
    border-radius: 18px;
    background: var(--abobora);
    color: #1d1026;
    font: 700 1.15rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--abobora-escura);
    -webkit-tap-highlight-color: transparent;
  }
  .botao-ar:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--abobora-escura);
  }
  .botao-ar:focus-visible {
    outline: 3px solid var(--osso);
    outline-offset: 4px;
  }

  .dica {
    margin: 16px auto 0;
    max-width: 30em;
    text-align: center;
    font-size: 0.98rem;
    line-height: 1.45;
    color: var(--osso-suave);
  }
  .dica b { color: var(--osso); font-weight: 600; }

  @media (max-height: 640px) {
    .dica { display: none; }
  }
</style>
</head>
<body>

  <h1>Tem um monstro na garagem</h1>

  <model-viewer
    src="Monstro.glb"
    alt="Monstro animado em tamanho real"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    autoplay
    camera-controls
    interaction-prompt="none"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1.1"
    loading="eager"
    reveal="auto">

    <div class="progresso" slot="progress-bar">
      <span>Acordando o monstro…</span>
      <div class="trilho"><div class="barra" id="barra"></div></div>
    </div>

    <button class="botao-ar" slot="ar-button">Ver o monstro em tamanho real</button>
  </model-viewer>

  <p class="dica">
    Toque no botão, aponte a câmera para o <b>chão da garagem</b> e ande devagar até o monstro aparecer.
  </p>

  <script>
    var viewer = document.querySelector("model-viewer");
    var barra = document.getElementById("barra");
    viewer.addEventListener("progress", function (e) {
      barra.style.width = Math.round(e.detail.totalProgress * 100) + "%";
    });
  </script>
</body>
</html>
